name: KRA API Practice

on:
  workflow_dispatch:
    inputs:
      rc_month:
        description: "수집 월(YYYYMM)"
        required: true
        default: "202503"
        type: string

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      - name: Show collection plan
        run: echo "서울 ${{ inputs.rc_month }} 자료를 수집합니다."

      - name: Check API key
        env:
          SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
        run: |
          if [ -z "$SERVICE_KEY" ]; then
            echo "::error::DATA_GO_KR_SERVICE_KEY가 없습니다."
            exit 1
          fi

          echo "API 키를 정상적으로 불러왔습니다."

      - name: Fetch race results
        env:
          SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
        run: |
          mkdir -p output

          curl --fail --silent --show-error --get \
            "https://apis.data.go.kr/B551015/API214_1/RaceDetailResult_1" \
            --data-urlencode "serviceKey=$SERVICE_KEY" \
            --data-urlencode "pageNo=1" \
            --data-urlencode "numOfRows=100000" \
            --data-urlencode "_type=json" \
            --data-urlencode "meet=1" \
            --data-urlencode "rc_month=${{ inputs.rc_month }}" \
            --output output/race_results_raw.json

          python -c 'import json; d=json.load(open("output/race_results_raw.json")); h=d["response"]["header"]; print("API result:", h); assert str(h["resultCode"]) in {"00", "0000"}, h; print("totalCount:", d["response"]["body"]["totalCount"])'

      - name: Convert JSON to CSV
        run: |
          python <<'PY'
          import csv
          import json

          with open(
              "output/race_results_raw.json",
              encoding="utf-8",
          ) as file:
              data = json.load(file)

          body = data["response"]["body"]
          raw_items = (body.get("items") or {}).get("item", [])

          if isinstance(raw_items, dict):
              items = [raw_items]
          else:
              items = raw_items

          expected_rows = int(body["totalCount"])

          if len(items) != expected_rows:
              raise SystemExit(
                  f"행 수 불일치: totalCount={expected_rows}, "
                  f"실제 행={len(items)}"
              )

          columns = sorted(
              {column for item in items for column in item}
          )

          with open(
              "output/race_results.csv",
              "w",
              encoding="utf-8-sig",
              newline="",
          ) as file:
              writer = csv.DictWriter(
                  file,
                  fieldnames=columns,
              )
              writer.writeheader()
              writer.writerows(items)

          print(f"CSV rows: {len(items)}")
          print(f"CSV columns: {len(columns)}")
          PY

      - name: Upload JSON and CSV as artifact
        uses: actions/upload-artifact@v7
        with:
          name: kra-race-results-${{ inputs.rc_month }}
          path: |
            output/race_results_raw.json
            output/race_results.csv
          if-no-files-found: error
          retention-days: 14

      - name: Check Dropbox token
        env:
          DROPBOX_ACCESS_TOKEN: ${{ secrets.DROPBOX_ACCESS_TOKEN }}
        run: |
          if [ -z "$DROPBOX_ACCESS_TOKEN" ]; then
            echo "::error::DROPBOX_ACCESS_TOKEN이 없습니다."
            exit 1
          fi

          echo "Dropbox 토큰을 정상적으로 불러왔습니다."

      - name: Ensure Dropbox practice folder exists
        env:
          DROPBOX_ACCESS_TOKEN: ${{ secrets.DROPBOX_ACCESS_TOKEN }}
        run: |
          STATUS=$(
            curl --silent --show-error \
              --request POST \
              "https://api.dropboxapi.com/2/files/create_folder_v2" \
              --header "Authorization: Bearer $DROPBOX_ACCESS_TOKEN" \
              --header "Content-Type: application/json" \
              --data '{"autorename":false,"path":"/practice"}' \
              --output /tmp/dropbox-folder-response.json \
              --write-out "%{http_code}"
          )

          if [ "$STATUS" = "200" ]; then
            echo "Dropbox /practice 폴더를 만들었습니다."
          elif [ "$STATUS" = "409" ]; then
            echo "Dropbox /practice 폴더가 이미 있습니다."
          else
            echo "::error::Dropbox 폴더 준비 실패: HTTP $STATUS"
            cat /tmp/dropbox-folder-response.json
            exit 1
          fi

      - name: Upload files to Dropbox
        env:
          DROPBOX_ACCESS_TOKEN: ${{ secrets.DROPBOX_ACCESS_TOKEN }}
          RC_MONTH: ${{ inputs.rc_month }}
        run: |
          upload_file() {
            local source_path="$1"
            local destination_path="$2"

            curl --fail-with-body --silent --show-error \
              --request POST \
              "https://content.dropboxapi.com/2/files/upload" \
              --header "Authorization: Bearer $DROPBOX_ACCESS_TOKEN" \
              --header "Content-Type: application/octet-stream" \
              --header "Dropbox-API-Arg: {\"autorename\":false,\"mode\":\"overwrite\",\"mute\":true,\"path\":\"$destination_path\",\"strict_conflict\":false}" \
              --data-binary "@$source_path"

            echo
            echo "Uploaded: $destination_path"
          }

          upload_file \
            "output/race_results_raw.json" \
            "/practice/race_results_${RC_MONTH}_raw.json"

          upload_file \
            "output/race_results.csv" \
            "/practice/race_results_${RC_MONTH}.csv"
